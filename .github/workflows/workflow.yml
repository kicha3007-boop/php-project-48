name: PHP CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug
      - name: Validate
        run: make validate
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Tests with coverage
        run: make test-coverage
